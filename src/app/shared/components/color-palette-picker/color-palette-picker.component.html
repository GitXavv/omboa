<div class="cpp-grid">
  @for (color of swatches; track color) {
    <button
      type="button"
      class="cpp-swatch"
      [class.cpp-swatch--selected]="value() === color"
      [style.background]="color"
      (click)="select(color)"
      [attr.aria-label]="color"
      [attr.aria-pressed]="value() === color"
    >
      @if (value() === color) { <span class="cpp-swatch__check">✓</span> }
    </button>
  }
</div>
