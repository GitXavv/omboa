<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-card__header">
      <span class="auth-card__logo">O'Mboa</span>
      <h2>Créer un compte</h2>
      <p class="text-muted">Rejoignez-nous et profitez de nos avantages fidélité.</p>
    </div>

    <form class="auth-form" (ngSubmit)="submit()">
      @if (error()) {
        <div class="auth-form__error">{{ error() }}</div>
      }

      <div class="form-group">
        <label for="fullName">Nom complet <span style="color:var(--color-error)">*</span></label>
        <input id="fullName" type="text" class="form-control" placeholder="Jean Mbida"
          [ngModel]="fullName()" (ngModelChange)="fullName.set($event)" name="fullName" required>
      </div>

      <div class="form-group">
        <label for="email">Adresse email <span style="color:var(--color-error)">*</span></label>
        <input id="email" type="email" class="form-control" placeholder="votre@email.com"
          [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" required>
      </div>

      <div class="form-group">
        <label for="phone">Numéro de téléphone <span class="text-muted">(optionnel)</span></label>
        <input id="phone" type="tel" class="form-control" placeholder="6XX XXX XXX"
          [ngModel]="phone()" (ngModelChange)="phone.set($event)" name="phone">
      </div>

      <div class="form-group">
        <label for="password">Mot de passe <span style="color:var(--color-error)">*</span></label>
        <input id="password" type="password" class="form-control" placeholder="Minimum 8 caractères"
          [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" minlength="8" required>
      </div>

      <button type="submit" class="btn btn--primary btn--full btn--lg" [disabled]="loading()">
        @if (loading()) { Création en cours… } @else { Créer mon compte }
      </button>
    </form>

    <p class="auth-card__footer text-muted">
      Déjà un compte ?
      <a routerLink="/auth/login" class="text-primary">Se connecter</a>
    </p>
  </div>
</div>
