<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-card__header">
      <span class="auth-card__logo">O'Mboa</span>
      <h2>Connexion</h2>
      <p class="text-muted">Content de vous revoir !</p>
    </div>

    <form class="auth-form" (ngSubmit)="submit()">
      @if (error()) {
        <div class="auth-form__error">{{ error() }}</div>
      }

      <div class="form-group">
        <label for="email">Adresse email</label>
        <input
          id="email"
          type="email"
          class="form-control"
          placeholder="votre@email.com"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          class="form-control"
          placeholder="••••••••"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="btn btn--primary btn--full btn--lg" [disabled]="loading()">
        @if (loading()) { Connexion… } @else { Se connecter }
      </button>
    </form>

    <p class="auth-card__footer text-muted">
      Pas encore de compte ?
      <a routerLink="/auth/register" class="text-primary">Créer un compte</a>
    </p>
  </div>
</div>
