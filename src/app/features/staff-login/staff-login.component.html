<div class="staff-login-page">
  <div class="staff-login-card">
    <h1 class="staff-login-title">Accès staff</h1>
    <p class="staff-login-hint">Saisissez votre clé d'accès.</p>

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <input
          type="password"
          class="form-control staff-login-input"
          placeholder="Clé d'accès"
          autocomplete="off"
          [ngModel]="key()"
          (ngModelChange)="key.set($event)"
          name="key"
          autofocus
        >
      </div>

      @if (error()) {
        <p class="staff-login-error">{{ error() }}</p>
      }

      <button type="submit" class="btn btn--primary btn--full" [disabled]="loading() || !key().trim()">
        @if (loading()) { Vérification… } @else { Entrer }
      </button>
    </form>
  </div>
</div>
