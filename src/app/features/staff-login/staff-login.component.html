<div class="key-login-page">
  <div class="key-login-bg" aria-hidden="true">
    <div class="key-login-bg__pattern"></div>
    <div class="key-login-bg__watermark"></div>
  </div>

  <div class="key-login-card">
    <img [src]="restaurantSvc.logoUrl()" alt="" class="key-login-logo">

    <div class="key-login-body">
      <h1 class="key-login-role">Accès staff</h1>
      <p class="key-login-hint">Entrez la clé d'accès pour continuer</p>

      <form (ngSubmit)="submit()" class="key-login-form">
        <input
          type="password"
          class="form-control key-login-input"
          autocomplete="off"
          [ngModel]="key()"
          (ngModelChange)="key.set($event)"
          name="key"
          [disabled]="locked()"
          autofocus
        >
        <button type="submit" class="btn btn--primary btn--full" [disabled]="loading() || locked() || !key().trim()">
          @if (loading()) { Vérification… } @else { Entrer }
        </button>
      </form>
    </div>
  </div>

  @if (error()) {
    <p class="key-login-error">{{ error() }}</p>
  }
</div>
