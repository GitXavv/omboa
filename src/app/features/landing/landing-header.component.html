<div class="lh-bg"></div>
<header class="lh-bar" [class.lh-bar--scrolled]="scrolled()">
  <div class="container lh-inner">

    <a href="#top" class="lh-logo" (click)="scrollTo($event, '#top')">
      <img src="icons/main/omboa-main-logo.png" alt="Omboa" class="lh-logo__img">
    </a>

    <nav class="lh-links" [class.lh-links--open]="mobileMenuOpen()">
      @for (link of navLinks; track link.href) {
        <a class="lh-links__item" [href]="link.href" (click)="scrollTo($event, link.href)">{{ link.label }}</a>
      }
    </nav>

    <a href="#demo" class="btn btn--primary btn--sm lh-demo-btn" (click)="scrollTo($event, '#demo')">Réserver une démo</a>

    <button
      class="lh-toggle"
      [class.lh-toggle--open]="mobileMenuOpen()"
      (click)="toggleMobileMenu()"
      aria-label="Ouvrir le menu"
      [attr.aria-expanded]="mobileMenuOpen()"
    >
      <img src="icons/hamburger.svg" alt="" class="lh-toggle__icon">
    </button>

  </div>
</header>
