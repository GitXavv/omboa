<div class="sa-page">
  <header class="sa-header">
    <h1>Logs super admin</h1>
    <a routerLink="/osuper/dashboard" class="btn btn--ghost btn--sm">← Retour</a>
  </header>

  @if (loading()) {
    <app-loader label="Chargement…" />
  } @else {
    <div class="sa-log-list">
      @for (l of logs(); track l.id) {
        <div class="sa-log-row">
          <span class="sa-log-row__type">{{ labels[l.event_type] ?? l.event_type }}</span>
          <span class="sa-log-row__desc text-muted">{{ l.description }}</span>
          <span class="sa-log-row__date text-muted">{{ l.created_at | date:'dd/MM/yyyy HH:mm' }}</span>
        </div>
      }
      @if (!logs().length) {
        <p class="text-muted" style="padding:32px;text-align:center">Aucun log.</p>
      }
    </div>

    <div class="sa-pagination">
      <button class="btn btn--ghost btn--sm" [disabled]="page() === 1" (click)="prevPage()">← Précédent</button>
      <span class="text-muted">Page {{ page() }}</span>
      <button class="btn btn--ghost btn--sm" [disabled]="logs().length < 50" (click)="nextPage()">Suivant →</button>
    </div>
  }
</div>
